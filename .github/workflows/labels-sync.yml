name: Sync labels

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: [self-hosted, Linux, X64, weblime-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          yaml-file: .github/labels.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
