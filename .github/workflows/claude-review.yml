name: Claude Code Review

# Per-repo caller. The only Claude file each repo needs.
# All logic lives in the org reusable workflow; this just wires the trigger
# and forwards only the Claude OAuth token required by that reusable workflow.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    uses: WebLime-agency/.github/.github/workflows/claude-review-reusable.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
