name: Publish Managed Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel to publish.
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - nightly
      source_ref:
        description: Optional source ref. Defaults to main for stable and dev for beta/nightly.
        required: false
        type: string
      release_id:
        description: Optional release identifier. Defaults to channel, version, timestamp, and source SHA.
        required: false
        type: string
      version_mode:
        description: How to resolve stable release versions.
        required: false
        default: auto
        type: choice
        options:
          - auto
          - explicit
      bump:
        description: Semver component to bump when version_mode=auto.
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Explicit semantic version. Required when version_mode=explicit; ignored when version_mode=auto.
        required: false
        type: string
      retention_count:
        description: Number of releases to keep in the channel manifest and release assets.
        required: false
        default: "10"
        type: string
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-managed-release-${{ github.event_name == 'schedule' && 'stable' || github.event.inputs.channel || 'manual' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish:
    name: Publish Channel Artifact
    runs-on: [self-hosted, Linux, X64, weblime-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve channel source
        id: release
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel || '' }}
          INPUT_SOURCE_REF: ${{ github.event.inputs.source_ref || '' }}
          INPUT_RELEASE_ID: ${{ github.event.inputs.release_id || '' }}
          INPUT_VERSION_MODE: ${{ github.event.inputs.version_mode || 'auto' }}
          INPUT_BUMP: ${{ github.event.inputs.bump || 'patch' }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_RETENTION_COUNT: ${{ github.event.inputs.retention_count || '' }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN != '' }}
        run: |
          set -euo pipefail

          git fetch origin main dev --tags

          channel="${INPUT_CHANNEL:-nightly}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            channel="stable"
          fi

          case "${channel}" in
            stable|beta|nightly) ;;
            *)
              echo "::error::Unsupported release channel: ${channel}"
              exit 1
              ;;
          esac

          if [ -n "${INPUT_SOURCE_REF}" ]; then
            source_ref="${INPUT_SOURCE_REF}"
          elif [ "${channel}" = "stable" ]; then
            source_ref="main"
          else
            source_ref="dev"
          fi

          if git rev-parse -q --verify "origin/${source_ref}^{commit}" >/dev/null; then
            git checkout --detach "origin/${source_ref}"
          else
            git checkout --detach "${source_ref}"
          fi

          release_pr_number=""
          release_pr_url=""
          should_publish="true"
          noop_message=""
          latest_stable_tag=""
          latest_stable_tag_sha=""

          if [ "${channel}" = "stable" ]; then
            origin_main_sha="$(git rev-parse origin/main)"
            selected_source_sha="$(git rev-parse HEAD)"
            if [ "${selected_source_sha}" != "${origin_main_sha}" ]; then
              echo "::error::Stable releases must publish current origin/main. Promote the desired source to main before running the stable publish workflow."
              exit 1
            fi

            if [ "${{ github.event_name }}" = "schedule" ]; then
              gate_output="$(mktemp)"
              scripts/check-stable-release-work.sh origin/main | tee "${gate_output}"
              should_publish="$(awk -F= '$1 == "should_publish" { print substr($0, index($0, "=") + 1); exit }' "${gate_output}")"
              latest_stable_tag="$(awk -F= '$1 == "latest_tag" { print substr($0, index($0, "=") + 1); exit }' "${gate_output}")"
              latest_stable_tag_sha="$(awk -F= '$1 == "latest_tag_sha" { print substr($0, index($0, "=") + 1); exit }' "${gate_output}")"

              if [ "${should_publish}" = "false" ]; then
                source_sha="$(awk -F= '$1 == "source_sha" { print substr($0, index($0, "=") + 1); exit }' "${gate_output}")"
                noop_message="No new work on main since ${latest_stable_tag}; nothing to publish."
                echo "${noop_message}"

                {
                  echo "channel=${channel}"
                  echo "source_ref=${source_ref}"
                  echo "source_sha=${source_sha}"
                  echo "source_short=${source_sha:0:12}"
                  echo "should_publish=false"
                  echo "noop_message=${noop_message}"
                  echo "latest_stable_tag=${latest_stable_tag}"
                  echo "latest_stable_tag_sha=${latest_stable_tag_sha}"
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            resolved_version="$(
              VERSION_MODE="${INPUT_VERSION_MODE}" \
              BUMP="${INPUT_BUMP}" \
              VERSION="${INPUT_VERSION}" \
              scripts/compute-release-version.sh
            )"

            scripts/update-release-version-files.sh "${resolved_version}"

            git config user.name "${GITHUB_ACTOR}"
            git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

            if git diff --quiet -- Cargo.toml Cargo.lock apps/web/package.json; then
              echo "Version files already at ${resolved_version}; skipping release bump commit."
            else
              git add Cargo.toml Cargo.lock apps/web/package.json
              git commit -m "chore(release): bump to v${resolved_version}"
            fi

            origin_main_sha="$(git rev-parse origin/main)"
            bump_source_sha="$(git rev-parse HEAD)"

            if [ "${bump_source_sha}" != "${origin_main_sha}" ]; then
              if [ "${HAS_RELEASE_PUSH_TOKEN}" != "true" ]; then
                echo "::error::Stable release version bumps must move through a pull request. Add RELEASE_PUSH_TOKEN so the workflow can create the release bump PR and trigger CI."
                exit 1
              fi

              release_branch="release/stable-v${resolved_version}"
              push_url="https://x-access-token:${RELEASE_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
              git push --force-with-lease "${push_url}" "HEAD:refs/heads/${release_branch}"

              export GH_TOKEN="${RELEASE_PUSH_TOKEN}"
              release_pr_number="$(gh pr list \
                --base main \
                --head "${GITHUB_REPOSITORY_OWNER}:${release_branch}" \
                --state open \
                --json number \
                --jq '.[0].number')"

              if [ -z "${release_pr_number}" ]; then
                release_pr_url="$(gh pr create \
                  --base main \
                  --head "${release_branch}" \
                  --title "chore(release): bump to v${resolved_version}" \
                  --body "Automated stable release version bump for v${resolved_version}.")"
                release_pr_number="${release_pr_url##*/}"
              else
                release_pr_url="$(gh pr view "${release_pr_number}" --json url --jq '.url')"
              fi

              echo "Stable release bump PR: ${release_pr_url}"
              if ! gh pr merge "${release_pr_number}" --squash --auto --delete-branch; then
                echo "::warning::Could not enable auto-merge immediately. Polling the release bump PR; it must merge before publishing can continue."
              fi

              deadline=$((SECONDS + 5400))
              poll_count=0
              while true; do
                pr_state="$(gh pr view "${release_pr_number}" --json state --jq '.state')"
                merged_at="$(gh pr view "${release_pr_number}" --json mergedAt --jq '.mergedAt // ""')"

                if [ -n "${merged_at}" ]; then
                  break
                fi

                if [ "${pr_state}" = "CLOSED" ]; then
                  echo "::error::Stable release bump PR ${release_pr_number} closed without merging."
                  exit 1
                fi

                if [ "${SECONDS}" -ge "${deadline}" ]; then
                  echo "::error::Timed out waiting for stable release bump PR ${release_pr_number} to merge."
                  gh pr checks "${release_pr_number}" --required || true
                  exit 1
                fi

                poll_count=$((poll_count + 1))
                if [ $((poll_count % 10)) -eq 0 ]; then
                  gh pr checks "${release_pr_number}" --required || true
                fi
                sleep 30
              done

              git fetch origin main --tags
              git checkout --detach origin/main
            fi

            source_sha="$(git rev-parse HEAD)"

            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nucleus-daemon") | .version')"
            if [ "${version}" != "${resolved_version}" ]; then
              echo "::error::cargo metadata resolved version ${version}, expected ${resolved_version}"
              exit 1
            fi
          else
            source_sha="$(git rev-parse HEAD)"
            version="${INPUT_VERSION:-$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "nucleus-daemon") | .version')}"
          fi

          timestamp="$(date -u +%Y%m%d%H%M%S)"
          release_id="${INPUT_RELEASE_ID:-nucleus-${channel}-${version}-${timestamp}-${source_sha:0:12}}"
          retention_count="${INPUT_RETENTION_COUNT:-10}"
          channel_tag="nucleus-channel-${channel}"
          manifest_name="manifest-${channel}.json"
          artifact_base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${channel_tag}"

          if ! [[ "${retention_count}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::retention_count must be a positive integer"
            exit 1
          fi

          {
            echo "channel=${channel}"
            echo "source_ref=${source_ref}"
            echo "source_sha=${source_sha}"
            echo "source_short=${source_sha:0:12}"
            echo "version=${version}"
            echo "resolved_version=${version}"
            echo "release_id=${release_id}"
            echo "release_pr_number=${release_pr_number}"
            echo "release_pr_url=${release_pr_url}"
            echo "should_publish=${should_publish}"
            echo "noop_message=${noop_message}"
            echo "latest_stable_tag=${latest_stable_tag}"
            echo "latest_stable_tag_sha=${latest_stable_tag_sha}"
            echo "retention_count=${retention_count}"
            echo "channel_tag=${channel_tag}"
            echo "manifest_name=${manifest_name}"
            echo "artifact_base_url=${artifact_base_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Rust
        if: steps.release.outputs.should_publish == 'true'
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.release.outputs.should_publish == 'true'
        run: npm ci

      - name: Verify Rust
        if: steps.release.outputs.should_publish == 'true'
        run: |
          cargo fmt --all --check
          cargo test --manifest-path Cargo.toml

      - name: Verify and build web
        if: steps.release.outputs.should_publish == 'true'
        run: |
          npm run check:web
          npm run build:web

      - name: Build release binaries
        if: steps.release.outputs.should_publish == 'true'
        run: cargo build --release -p nucleus-daemon -p nucleus-cli

      - name: Restore current channel manifest
        if: steps.release.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL_TAG: ${{ steps.release.outputs.channel_tag }}
          MANIFEST_NAME: ${{ steps.release.outputs.manifest_name }}
        run: |
          set -euo pipefail

          mkdir -p dist/releases
          if gh release view "${CHANNEL_TAG}" >/dev/null 2>&1; then
            gh release download "${CHANNEL_TAG}" \
              --pattern "${MANIFEST_NAME}" \
              --dir dist/releases \
              --clobber || true
          fi

      - name: Package managed release
        if: steps.release.outputs.should_publish == 'true'
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          VERSION: ${{ steps.release.outputs.version }}
          MANIFEST_NAME: ${{ steps.release.outputs.manifest_name }}
          ARTIFACT_BASE_URL: ${{ steps.release.outputs.artifact_base_url }}
        run: |
          set -euo pipefail

          target/release/nucleus release package \
            --release-id "${RELEASE_ID}" \
            --version "${VERSION}" \
            --channel "${CHANNEL}" \
            --daemon-binary target/release/nucleus-daemon \
            --cli-binary target/release/nucleus \
            --web-dist-dir apps/web/build \
            --output-dir dist/releases \
            --artifact-base-url "${ARTIFACT_BASE_URL}" \
            --manifest-path "dist/releases/${MANIFEST_NAME}" \
            --minimum-client-version "${VERSION}" \
            --minimum-server-version "${VERSION}" \
            --capability-flag daemon-owned-update-state \
            --capability-flag embedded-web-build \
            --capability-flag install-kind-contract

      - name: Apply channel retention
        id: retention
        if: steps.release.outputs.should_publish == 'true'
        env:
          MANIFEST_NAME: ${{ steps.release.outputs.manifest_name }}
          RETENTION_COUNT: ${{ steps.release.outputs.retention_count }}
        run: |
          set -euo pipefail

          manifest_path="dist/releases/${MANIFEST_NAME}"
          pruned_assets="$(mktemp)"

          jq -r \
            --argjson keep "${RETENTION_COUNT}" \
            '.releases | sort_by(.published_at) | reverse | .[$keep:][]?.artifacts[]?.download_url | split("/")[-1]' \
            "${manifest_path}" > "${pruned_assets}"

          jq \
            --argjson keep "${RETENTION_COUNT}" \
            '.releases = (.releases | sort_by(.published_at) | reverse | .[:$keep])' \
            "${manifest_path}" > "${manifest_path}.tmp"
          mv "${manifest_path}.tmp" "${manifest_path}"

          {
            echo 'pruned_assets<<EOF'
            cat "${pruned_assets}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate packaged install
        if: steps.release.outputs.should_publish == 'true'
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          MANIFEST_NAME: ${{ steps.release.outputs.manifest_name }}
        run: |
          set -euo pipefail

          install_root="${RUNNER_TEMP}/nucleus-managed-install"
          state_dir="${RUNNER_TEMP}/nucleus-managed-state"
          validation_manifest="${RUNNER_TEMP}/${MANIFEST_NAME}"

          jq \
            --arg artifact_root "${GITHUB_WORKSPACE}/dist/releases" \
            '.releases |= map(.artifacts |= map(.download_url = ("file://" + $artifact_root + "/" + (.download_url | split("/")[-1]))))' \
            "dist/releases/${MANIFEST_NAME}" > "${validation_manifest}"

          target/release/nucleus \
            --state-dir "${state_dir}" \
            release install \
            --manifest-url "file://${validation_manifest}" \
            --channel "${CHANNEL}" \
            --install-root "${install_root}" \
            --install-service false \
            --bind 127.0.0.1:5201

          test -x "${install_root}/current/bin/nucleus-daemon"
          test -x "${install_root}/current/bin/nucleus"
          test -f "${install_root}/current/web/index.html"
          test -f "${install_root}/current/scripts/browser-sidecar.mjs"
          test -d "${install_root}/current/node_modules/playwright"
          test -d "${install_root}/current/node_modules/playwright-core"

      - name: Push stable source tag
        id: stable_source_tag
        if: steps.release.outputs.should_publish == 'true' && steps.release.outputs.channel == 'stable'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN != '' }}
        run: |
          set -euo pipefail

          if [ "$(git rev-parse HEAD)" != "${SOURCE_SHA}" ]; then
            echo "::error::Local release source does not match resolved source ${SOURCE_SHA}"
            exit 1
          fi

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          push_url="https://x-access-token:${RELEASE_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch --tags origin
          version_tag="v${VERSION}"
          tag_created=false
          if git rev-parse -q --verify "refs/tags/${version_tag}" >/dev/null; then
            tag_target="$(git rev-list -n 1 "${version_tag}")"
            if [ "${tag_target}" != "${SOURCE_SHA}" ]; then
              echo "::error::Release tag ${version_tag} already exists at ${tag_target}, not current source ${SOURCE_SHA}."
              exit 1
            fi
            echo "Release tag ${version_tag} already exists at current source; skipping tag creation."
          else
            git tag -a "${version_tag}" "${SOURCE_SHA}" -m "Release ${version_tag}"
            if ! git push "${push_url}" "refs/tags/${version_tag}"; then
              if [ "${HAS_RELEASE_PUSH_TOKEN}" != "true" ]; then
                echo "::error::Pushing the stable source tag failed with the default GITHUB_TOKEN. Add a RELEASE_PUSH_TOKEN repo secret with contents: write permission for release tags, then rerun the workflow."
              else
                echo "::error::Pushing the stable source tag failed. Verify RELEASE_PUSH_TOKEN has contents: write permission and can push release tags."
              fi
              exit 1
            fi
            tag_created=true
          fi

          {
            echo "pushed=true"
            echo "version_tag=${version_tag}"
            echo "tag_created=${tag_created}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish channel release
        id: publish_channel
        if: steps.release.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          CHANNEL_TAG: ${{ steps.release.outputs.channel_tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          SOURCE_SHORT: ${{ steps.release.outputs.source_short }}
          SOURCE_REF: ${{ steps.release.outputs.source_ref }}
          VERSION: ${{ steps.release.outputs.version }}
          MANIFEST_NAME: ${{ steps.release.outputs.manifest_name }}
          ARTIFACT_BASE_URL: ${{ steps.release.outputs.artifact_base_url }}
          PRUNED_ASSETS: ${{ steps.retention.outputs.pruned_assets }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${CHANNEL_TAG}" "${SOURCE_SHA}" \
            -m "Nucleus ${CHANNEL} channel through ${SOURCE_SHA}"
          git push --force origin "refs/tags/${CHANNEL_TAG}"

          notes_file="$(mktemp)"
          cat > "${notes_file}" <<EOF
          Nucleus ${CHANNEL} channel manifest and artifacts.

          - Channel: \`${CHANNEL}\`
          - Release ID: \`${RELEASE_ID}\`
          - Version: \`${VERSION}\`
          - Source: \`${SOURCE_REF}\` at \`${SOURCE_SHORT}\`
          - Manifest: \`${ARTIFACT_BASE_URL}/${MANIFEST_NAME}\`

          Managed installs track this channel manifest rather than a git branch.
          EOF

          release_args=(--title "Nucleus ${CHANNEL} channel" --notes-file "${notes_file}")
          if [ "${CHANNEL}" != "stable" ]; then
            release_args+=(--prerelease)
          fi

          if gh release view "${CHANNEL_TAG}" >/dev/null 2>&1; then
            gh release edit "${CHANNEL_TAG}" "${release_args[@]}"
          else
            gh release create "${CHANNEL_TAG}" --target "${SOURCE_SHA}" "${release_args[@]}"
          fi

          gh release upload "${CHANNEL_TAG}" \
            "dist/releases/nucleus-${RELEASE_ID}-"*.tar.gz \
            "dist/releases/${MANIFEST_NAME}" \
            --clobber

          while IFS= read -r asset_name; do
            [ -n "${asset_name}" ] || continue
            asset_api_url="$(gh release view "${CHANNEL_TAG}" --json assets --jq ".assets[] | select(.name == \"${asset_name}\") | .apiUrl" || true)"
            if [ -n "${asset_api_url}" ]; then
              asset_api_path="${asset_api_url#https://api.github.com/}"
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "${asset_api_path}"
            fi
          done <<EOF
          ${PRUNED_ASSETS}
          EOF

      - name: Roll back stable source refs after publish failure
        if: ${{ failure() && steps.release.outputs.should_publish == 'true' && steps.publish_channel.outcome == 'failure' && steps.release.outputs.channel == 'stable' && steps.stable_source_tag.outputs.pushed == 'true' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          VERSION_TAG: ${{ steps.stable_source_tag.outputs.version_tag }}
          TAG_CREATED: ${{ steps.stable_source_tag.outputs.tag_created }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN != '' }}
        run: |
          set -euo pipefail

          push_url="https://x-access-token:${RELEASE_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rollback_refs=()

          if [ "${TAG_CREATED}" = "true" ]; then
            tag_target="$(git ls-remote "${push_url}" "refs/tags/${VERSION_TAG}^{}" | awk '{ print $1 }')"
            if [ "${tag_target}" = "${SOURCE_SHA}" ]; then
              rollback_refs+=(":refs/tags/${VERSION_TAG}")
            else
              echo "::warning::Skipping ${VERSION_TAG} rollback because it no longer points at ${SOURCE_SHA}."
            fi
          fi

          if [ "${#rollback_refs[@]}" -eq 0 ]; then
            echo "No stable source refs needed rollback."
            exit 0
          fi

          if ! git push --atomic "${push_url}" "${rollback_refs[@]}"; then
            if [ "${HAS_RELEASE_PUSH_TOKEN}" != "true" ]; then
              echo "::error::Publish failed after the stable source tag push, and rollback failed with the default GITHUB_TOKEN. Add a RELEASE_PUSH_TOKEN repo secret with contents: write permission scoped to allow release tag pushes, then repair ${VERSION_TAG} manually."
            else
              echo "::error::Publish failed after the stable source tag push, and rollback failed. Verify RELEASE_PUSH_TOKEN can update release tags, then repair ${VERSION_TAG} manually."
            fi
            exit 1
          fi

      - name: Validate published install
        if: steps.release.outputs.should_publish == 'true'
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: |
          set -euo pipefail

          install_root="${RUNNER_TEMP}/nucleus-published-install"
          state_dir="${RUNNER_TEMP}/nucleus-published-state"

          for attempt in 1 2 3 4 5 6; do
            rm -rf "${install_root}" "${state_dir}"
            if target/release/nucleus \
              --state-dir "${state_dir}" \
              release install \
              --channel "${CHANNEL}" \
              --install-root "${install_root}" \
              --install-service false \
              --bind 127.0.0.1:5202
            then
              break
            fi

            if [ "${attempt}" = "6" ]; then
              echo "::error::Published channel install did not succeed after ${attempt} attempts"
              exit 1
            fi
            sleep 10
          done

          test -x "${install_root}/current/bin/nucleus-daemon"
          test -x "${install_root}/current/bin/nucleus"
          test -f "${install_root}/current/web/index.html"
          test -f "${install_root}/current/scripts/browser-sidecar.mjs"
          test -d "${install_root}/current/node_modules/playwright"
          test -d "${install_root}/current/node_modules/playwright-core"

      - name: Summarize release
        if: steps.release.outputs.should_publish == 'true'
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL_TAG: ${{ steps.release.outputs.channel_tag }}
          MANIFEST_NAME: ${{ steps.release.outputs.manifest_name }}
          ARTIFACT_BASE_URL: ${{ steps.release.outputs.artifact_base_url }}
        run: |
          {
            echo "## Managed Release Published"
            echo
            echo "- Channel: \`${CHANNEL}\`"
            echo "- Release ID: \`${RELEASE_ID}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Channel tag: \`${CHANNEL_TAG}\`"
            echo "- Manifest URL: \`${ARTIFACT_BASE_URL}/${MANIFEST_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize no-op
        if: steps.release.outputs.should_publish == 'false'
        env:
          NOOP_MESSAGE: ${{ steps.release.outputs.noop_message }}
        run: |
          {
            echo "## Managed Release No-op"
            echo
            echo "${NOOP_MESSAGE}"
          } >> "$GITHUB_STEP_SUMMARY"
