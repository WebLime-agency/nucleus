name: Apply issue form area labels

on:
  issues:
    types:
      - opened
      - edited

permissions:
  issues: write

jobs:
  apply-area-label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply selected area label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const areaLabels = [
              'area: daemon',
              'area: web',
              'area: storage',
              'area: protocol',
              'area: memory',
              'area: workers',
              'area: vault',
              'area: skills',
              'area: mcp',
              'area: publication',
              'area: release',
              'area: infra'
            ];
            const body = issue.body || '';
            const fieldPattern = /(?:^|\n)### Affected subsystem\s*\n+([\s\S]*?)(?=\n### |\s*$)/m;
            const fieldMatch = body.match(fieldPattern);
            const fieldValue = fieldMatch ? fieldMatch[1].trim().split(/\r?\n/)[0]?.trim() : undefined;
            const selectedArea = areaLabels.includes(fieldValue) ? fieldValue : undefined;
            if (!selectedArea) {
              core.info('No issue-form area label found in issue body.');
              return;
            }

            const existingLabels = issue.labels.map((label) => label.name);
            const labelsToRemove = existingLabels.filter(
              (label) => label.startsWith('area: ') && label !== selectedArea
            );
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: label
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            if (!existingLabels.includes(selectedArea)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [selectedArea]
              });
            }
